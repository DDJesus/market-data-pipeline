version: 2

models:
  - name: stg_vendor_b__observations
    description: Clean staging representation of Vendor B sentiment observations.

    columns:
      - name: observation_id
        description: Vendor-provided unique identifier for an observation.
        data_tests:
          - not_null
          - unique

      - name: batch_id
        data_tests:
          - not_null

      - name: observed_at
        data_tests:
          - not_null

      - name: company
        data_tests:
          - not_null

      - name: sentiment
        data_tests:
          - not_null

      - name: engagement
        data_tests:
          - not_null
  
  - name: stg_vendor_b__batches
    description: Clean staging representation of Vendor B publication batches.

    columns:
      - name: batch_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_vendor_b__batches')
                field: batch_id

      - name: market_date
        data_tests:
          - not_null

      - name: batch_type
        data_tests:
          - not_null

      - name: window_start
        data_tests:
          - not_null

      - name: window_end
        data_tests:
          - not_null

      - name: observation_count
        data_tests:
          - not_null

      - name: sha256
        data_tests:
          - not_null
          - unique